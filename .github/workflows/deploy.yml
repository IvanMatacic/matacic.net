# Build with Hugo (extended) and deploy to GitHub Pages.
# Repo Settings → Pages → Source must be "GitHub Actions"; the custom domain is set there too.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; never cancel a run that is already publishing.
concurrency:
  group: pages
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  HUGO_VERSION: 0.165.0   # keep in step with the version used locally (hugo version)
  TZ: Europe/Zagreb

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Install Hugo (extended)
        run: |
          curl -sfL --output-dir "${{ runner.temp }}" -O \
            "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.tar.gz"
          mkdir -p "${HOME}/.local/hugo"
          tar -C "${HOME}/.local/hugo" -xf "${{ runner.temp }}/hugo_extended_${HUGO_VERSION}_linux-amd64.tar.gz"
          echo "${HOME}/.local/hugo" >> "${GITHUB_PATH}"

      - name: Verify Hugo
        run: hugo version

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v6

      - name: Build
        run: hugo --gc --minify --panicOnWarning --baseURL "https://matacic.net/"

      # ---- Search (Pagefind) — DISABLED ------------------------------------------------
      # Enable in three steps: (1) uncomment the two steps below, (2) set
      # features.search = true under [params] in hugo.toml, (3) push.
      # Pagefind indexes the finished HTML in ./public and writes its bundle to
      # ./public/pagefind/, which layouts/search.html loads when the feature flag is on.
      #
      # - name: Setup Node
      #   uses: actions/setup-node@v7
      #   with:
      #     node-version: 22
      #
      # - name: Build search index (Pagefind)
      #   run: npx -y pagefind --site public
      # -----------------------------------------------------------------------------------

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5

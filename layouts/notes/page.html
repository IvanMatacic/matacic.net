{{ define "main" }}
<div class="wrap">
  <article class="note col col-720">
    <header>
      <time class="meta num" datetime="{{ .Date.Format "2006-01-02" }}">{{ .Date.Format "2006-01-02" }}</time>
      <h1 class="note-heading">{{ .Title }}</h1>
    </header>
    <div class="prose note-body" data-pagefind-body>
      {{ .Content }}
    </div>
    {{- with .GetTerms "tags" }}
    <ul class="tags tags-foot" aria-label="Tags">
      {{- range . }}
      <li><a class="tag" href="{{ .RelPermalink }}">{{ .LinkTitle | lower }}</a></li>
      {{- end }}
    </ul>
    {{- end }}
  </article>
</div>
{{ end }}
